name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: cargo build --workspace
        run: cargo build --workspace

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo clippy --workspace -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: sizing-core has no chain/network dependency
        run: |
          if cargo tree -p sizing-core | grep -Ei "reqwest|ethers|alloy|solana|tokio"; then
            echo "FAIL: chain/network dependency leaked into sizing-core"
            exit 1
          fi
          echo "PASS: sizing-core has no chain/network dependency"
