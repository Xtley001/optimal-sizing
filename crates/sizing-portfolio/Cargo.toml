[package]
name = "sizing-portfolio"
version = "2.0.0"
edition = "2021"
authors = ["Christley OLUBELA (Xtley001)"]
description = "Constrained multi-pool portfolio capital allocation across heterogeneous AMM curves"
license = "MIT"
repository = "https://github.com/Xtley001/optimal-sizing"
keywords = ["defi", "amm", "portfolio", "arbitrage", "mev"]
categories = ["algorithms", "finance"]

[dependencies]
sizing-core = { path = "../sizing-core", version = "2.0.0" }
rust_decimal = { version = "1.36", default-features = false, features = ["maths", "std", "serde-with-str"] }
rust_decimal_macros = "1.36"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
proptest = "1.4"
