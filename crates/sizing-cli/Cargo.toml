[package]
name = "sizing-cli"
version = "0.1.0"
edition = "2021"
authors = ["Christley OLUBELA"]
description = "CLI tool for profit-maximizing trade sizing against CPMM, StableSwap, and PMM curves"
license = "MIT"
repository = "https://github.com/Xtley001/optimal-sizing"
readme = "../../README.md"
keywords = ["defi", "amm", "cli", "finance"]
categories = ["command-line-utilities", "finance"]

[[bin]]
name = "sizing-cli"
path = "src/main.rs"

[dependencies]
sizing-core = { path = "../sizing-core", version = "0.1.0" }
sizing-router = { path = "../sizing-router", version = "0.1.0" }
rust_decimal = { version = "1.36", default-features = false, features = ["maths", "std", "serde-with-str"] }
clap = { version = "=4.4.18", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
