[package]
name = "sizing-router"
version = "0.1.0"
edition = "2021"
authors = ["Christley OLUBELA"]
description = "Multi-hop heterogeneous trade route optimization across CPMM, StableSwap, PMM, and Balancer curves"
license = "MIT"
repository = "https://github.com/Xtley001/optimal-sizing"
readme = "../../README.md"
keywords = ["defi", "amm", "arbitrage", "routing", "finance"]
categories = ["finance", "mathematics"]

[dependencies]
sizing-core = { path = "../sizing-core", version = "0.1.0" }
rust_decimal = { version = "1.36", default-features = false, features = ["maths", "std"] }
rust_decimal_macros = "1.36"

[dev-dependencies]
proptest = "1.5"
