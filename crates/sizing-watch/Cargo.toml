[package]
name = "sizing-watch"
version = "0.1.0"
edition = "2021"
authors = ["Christley OLUBELA"]

[[bin]]
name = "sizing-watch"
path = "src/main.rs"

[dependencies]
sizing-core = { path = "../sizing-core" }
sizing-router = { path = "../sizing-router" }
rust_decimal = { version = "1.36", default-features = false, features = ["maths", "std", "serde-with-str"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "=4.4.18", features = ["derive"] }
